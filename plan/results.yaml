    },
    {
      "id": "R19-2",
      "planned_chapter": 19,
      "statement": "Starting at the origin with equally likely initial velocities, the position law has atoms of mass exp(-nu*t)/2 at each of plus and minus v*t, in addition to a continuous interior component for positive time.",
      "depends_on": [
        "R19-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Identify the zero-switch event probability and check that interior probability plus both atoms sums to one.",
      "hypothesis_boundary": "A histogram or smooth density formula that omits the atoms is incomplete at finite time.",
      "source_plan": {
