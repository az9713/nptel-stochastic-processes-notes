      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Calculate the mean for finite-width rectangular pulses and compare with a padded stationary simulation.",
      "hypothesis_boundary": "Starting arrivals at time zero produces a transient; it is not the stationary construction.",
