      "manuscript_file": "chapter-18-shot-noise.html"
    },
    {
      "id": "R19-1",
      "planned_chapter": 19,
      "statement": "For velocity plus or minus v with symmetric switching rate nu, the two position densities satisfy coupled advection-switching equations. Their sum rho satisfies partial_tt rho+2*nu*partial_t rho=v squared*partial_xx rho, with two initial conditions inherited from the initial position and velocity law.",
      "depends_on": [
        "R06-3",
        "R10-3",
