    },
    {
      "id": "R19-3",
      "planned_chapter": 19,
      "statement": "The displacement mean square for symmetric stationary initial velocity is (v squared/nu)*(t-(1-exp(-2*nu*t))/(2*nu)). At long time the effective diffusion coefficient is v squared/(2*nu); at short time the mean square is v squared*t squared.",
      "depends_on": [
        "R19-2"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Integrate the velocity covariance and compare with the inertial Brownian crossover.",
      "hypothesis_boundary": "A Gaussian diffusion limit describes the central scaling region and does not preserve finite-speed fronts.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          22
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-19-telegraph-diffusion.html"
    },
    {
      "id": "R20-1",
      "planned_chapter": 20,
      "statement": "For one-dimensional Brownian diffusion of coefficient D starting distance a positive from an absorbing target on an otherwise unbounded line, the first-arrival density is a*exp(-a squared/(4*D*t))/sqrt(4*pi*D*t cubed) for t positive. Its total probability is one while its mean time diverges.",
      "depends_on": [
        "R06-3",
        "R09-3",
        "R12-3",
        "R19-3"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Derive by reflection or image construction, integrate the density, and inspect its long-time first-moment integral.",
      "hypothesis_boundary": "A finite simulation cutoff can produce a finite sample mean even when the mathematical mean is infinite.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          23,
          24
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-20-first-passage.html"
    },
    {
      "id": "R20-2",
      "planned_chapter": 20,
      "statement": "For Brownian diffusion in an interval (0,L) absorbed at both endpoints, the mean first-exit time solves D*T''=-1 with T(0)=T(L)=0 and equals x*(L-x)/(2*D). The probability of first exiting at L is x/L.",
      "depends_on": [
        "R20-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Solve both boundary-value problems and compare with a finite-state absorbing-chain calculation.",
      "hypothesis_boundary": "Changing either boundary to reflecting changes the problem; forward and backward operators act on different arguments.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          23,
          24
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-20-first-passage.html"
    },
    {
      "id": "R20-3",
      "planned_chapter": 20,
      "statement": "For a time-homogeneous Markov process with a regenerative first-arrival decomposition at the target and appropriate transition density or mass, the target propagator is the time convolution of first-arrival law with the target-to-target propagator. Laplace transforms turn this convolution into a product.",
      "depends_on": [
        "R20-2"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Derive the Brownian first-arrival transform exp(-a*sqrt(s/D)) and a discrete lattice generating-function counterpart.",
      "hypothesis_boundary": "Point targets in higher-dimensional continuous space and non-Markov observations need separate hitting and renewal assumptions; fractal scaling is not Euclidean by default.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          23,
          24
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-20-first-passage.html"
    },
    {
      "id": "R21-1",
      "planned_chapter": 21,
      "statement": "For a discrete-time Markov chain started at state i, let u_n be the probability of being at i at step n with u_0=1 and f_n its first-return probability for n at least one. The renewal identity is u_n equal to the sum over k=1 through n of f_k*u_(n-k); hence U(z)=1/(1-F(z)) for absolute z less than one.",
      "depends_on": [
        "R03-3",
        "R06-3",
        "R20-3"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Verify the identity by exact path enumeration for a small finite chain.",
      "hypothesis_boundary": "A return time starts after the initial visit; including time zero destroys the first-return definition.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          25
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-21-returns-and-fractal-walks.html"
    },
    {
      "id": "R21-2",
      "planned_chapter": 21,
      "statement": "The state is recurrent exactly when the sum of its return probabilities u_n diverges. For the unbiased nearest-neighbor walk on the integer line, return is almost sure but the mean positive return time is infinite. A biased walk with positive step probabilities p and 1-p has return probability 2*min(p,1-p).",
      "depends_on": [
        "R21-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Obtain the return generating function and check its limit as bias tends to zero.",
      "hypothesis_boundary": "Recurrence does not imply a finite mean return time or a normalizable invariant law on an infinite lattice.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          25
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-21-returns-and-fractal-walks.html"
    },
    {
      "id": "R21-3",
      "planned_chapter": 21,
      "statement": "On a finite absorbing graph with transient transition submatrix K_TT in the book's column convention, expected exit times satisfy (identity-K_TT transpose)*T=ones. Scaling these solutions across graph sizes defines a numerical walk-dimension estimate rather than a theorem by itself.",
      "depends_on": [
        "R21-2"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Recover quadratic exit-time scaling on a line; derive or obtain a page-verified renormalization argument before stating an exact gasket walk exponent.",
      "hypothesis_boundary": "Separate graph distance, embedding distance, finite-size fit, and exact asymptotic walk dimension.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          25
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-21-returns-and-fractal-walks.html"
    },
    {
      "id": "R22-1",
      "planned_chapter": 22,
      "statement": "The symmetric nearest-neighbor walk on the integer d-dimensional lattice is recurrent for d=1 or d=2 and transient for d at least 3. The local return probability on its allowed even times decays proportionally to n raised to -d/2 at large n.",
      "depends_on": [
        "R03-3",
        "R06-3",
        "R20-3",
        "R21-3"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Derive the small-wave-number Green-function divergence and check parity against exact low-step counts.",
      "hypothesis_boundary": "A continuum Gaussian density at a point is not itself a lattice return probability; the allowed-time lattice normalization matters.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          26
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-22-recurrence-dimension-and-clocks.html"
    },
    {
      "id": "R22-2",
      "planned_chapter": 22,
      "statement": "For independent identically distributed jumps and independent identically distributed positive waiting times, the position at time t is the sum of the first N(t) jumps, where N(t) is the renewal count. Exponential waiting times give a memoryless clock and a continuous-time Markov walk.",
      "depends_on": [
        "R22-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Recover Poisson jump counts for exponential waiting and compare equal-rate discrete and continuous time laws.",
      "hypothesis_boundary": "Spatial jump recurrence and elapsed-time return moments are different questions.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          26
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-22-recurrence-dimension-and-clocks.html"
    },
    {
      "id": "R22-3",
      "planned_chapter": 22,
      "statement": "For a waiting density psi with survival function Psi positive at age a, the conditional instantaneous event rate is psi(a)/Psi(a). This hazard is constant for an exponential law; for a general waiting law the position alone omits the elapsed waiting age needed to determine future jump timing.",
      "depends_on": [
        "R22-2"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Derive residual waiting survival as Psi(a+t)/Psi(a) and compare several ages.",
      "hypothesis_boundary": "A non-Markov position process can often be embedded in a larger Markov state containing age, but existence and boundary details must be specified.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          26
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-22-recurrence-dimension-and-clocks.html"
    },
    {
      "id": "R23-1",
      "planned_chapter": 23,
      "statement": "For a decoupled continuous-time walk started at a renewal at the origin, jump characteristic function phi(k), and waiting-time Laplace transform psi_tilde(s), its position transform is (1-psi_tilde(s))/(s*(1-psi_tilde(s)*phi(k))) for positive s, under the usual nonexplosive renewal construction.",
      "depends_on": [
        "R01-3",
        "R03-3",
        "R20-3",
        "R22-3"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Recover the Markov compound-Poisson transform for exponential waits.",
      "hypothesis_boundary": "Aged initial conditions and coupled jump/wait laws change this formula.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          27
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-23-nonmarkovian-anomalous-transport.html"
    },
    {
      "id": "R23-2",
      "planned_chapter": 23,
      "statement": "For independent jumps with finite mean mu_J and variance sigma_J squared, independent of the renewal clock, mean position is mu_J*E[N(t)] and centered position variance is sigma_J squared*E[N(t)]+mu_J squared*Var(N(t)).",
      "depends_on": [
        "R23-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Use total expectation and total variance; verify the Poisson-clock limit.",
      "hypothesis_boundary": "Uncentered mean-square displacement also contains the squared mean; bias changes scaling conclusions.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          27
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-23-nonmarkovian-anomalous-transport.html"
    },
    {
      "id": "R23-3",
      "planned_chapter": 23,
      "statement": "If the waiting transform obeys 1-psi_tilde(s) asymptotic to (tau0*s)^alpha for alpha in (0,1), standard renewal Tauberian hypotheses yield E[N(t)] asymptotic to (t/tau0)^alpha/Gamma(1+alpha). For zero-mean finite-variance independent jumps this gives centered displacement variance asymptotic to sigma_J squared times that expression.",
      "depends_on": [
        "R23-2"
      ],
      "status_plan": "cite_pending_page_verification",
      "check": "State the Tauberian conditions and compare ensemble scaling with finite-horizon simulations using uncertainty estimates.",
      "hypothesis_boundary": "A power-law fit over a short window does not establish an asymptotic exponent or ergodicity; biased clocks add a separate renewal-count variance term.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          27
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-23-nonmarkovian-anomalous-transport.html"
    },
    {
      "id": "R24-1",
      "planned_chapter": 24,
      "statement": "A measurable map T transports a probability measure mu to a measure assigning each measurable set A the value mu(T inverse of A). An invariant measure satisfies mu(T inverse of A)=mu(A) for every measurable A.",
      "depends_on": [
        "R02-3",
        "R05-3",
        "R21-3"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Use the doubling map modulo one to verify invariance of uniform measure on intervals.",
      "hypothesis_boundary": "An invariant density depends on the reference measure and need not exist for every invariant measure.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          28
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-24-deterministic-probability.html"
    },
    {
      "id": "R24-2",
      "planned_chapter": 24,
      "statement": "For a piecewise smooth map with regular inverse branches and nonzero branch derivatives, density transfer at y is the sum of input density at each inverse point divided by the absolute map derivative. For the doubling map it is one half of rho(y/2)+rho((y+1)/2).",
      "depends_on": [
        "R24-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Verify mass conservation and transfer a nonuniform density through repeated iterations.",
      "hypothesis_boundary": "Coarse-grained cells need not form an exact Markov chain; finite-precision periodicity is a numerical artifact to examine explicitly.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          28
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-24-deterministic-probability.html"
    },
    {
      "id": "R24-3",
      "planned_chapter": 24,
      "statement": "For a measure-preserving map on a probability space, ergodicity means every invariant measurable set has measure zero or one. Under the ergodic theorem, time averages of integrable observables equal their invariant-measure mean almost everywhere when the map is ergodic.",
      "depends_on": [
        "R24-2"
      ],
      "status_plan": "cite_pending_page_verification",
      "check": "Compare a map with disconnected invariant components with the doubling map; distinguish the theorem from finite-time convergence evidence.",
      "hypothesis_boundary": "Measure preservation alone yields recurrence in finite measure but does not imply ergodicity or mixing.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          28
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-24-deterministic-probability.html"
    },
    {
      "id": "R25-1",
      "planned_chapter": 25,
      "statement": "For an independent binary occupancy sequence with occupied probability q in (0,1), the occupied-run length observed at an entrance has probability (1-q)*q raised to (n-1) for positive n. An interval sampled at an arbitrary occupied time is length-biased relative to the entrance-sampled interval.",
      "depends_on": [
        "R20-3",
        "R21-3",
        "R24-3"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Enumerate short binary words and compare entrance-sampled lengths with occupancy-sampled total run lengths.",
      "hypothesis_boundary": "Define discrete endpoints before differencing sojourn probabilities; memoryless residual lengths do not eliminate length bias of total intervals.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          29
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-25-sojourn-and-dynamical-recurrence.html"
    },
    {
      "id": "R25-2",
      "planned_chapter": 25,
      "statement": "For a measure-preserving transformation on a finite-measure space and a measurable set A, almost every point of A returns to A infinitely often. This requires neither independent visits nor ergodicity.",
      "depends_on": [
        "R25-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Prove recurrence using disjoint escaping sets and finite measure, handling the null set of exceptional points.",
      "hypothesis_boundary": "The theorem does not bound return time and fails without its finite invariant measure hypothesis.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          29
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-25-sojourn-and-dynamical-recurrence.html"
    },
    {
      "id": "R25-3",
      "planned_chapter": 25,
      "statement": "For an ergodic measure-preserving transformation on a probability space and A of positive measure, the conditional mean positive return time to A is 1/mu(A), under the standard Kac return-time theorem. Independent Bernoulli visits provide a geometric example; overlapping symbolic cylinders generally produce correlated visits.",
      "depends_on": [
        "R25-2"
      ],
      "status_plan": "cite_pending_page_verification",
      "check": "Verify the geometric mean by summation, then enumerate an overlapping cylinder to expose failure of an independence-based recurrence formula.",
      "hypothesis_boundary": "Kac's formula needs its precise measure-theoretic conditions; any Smoluchowski or finite-difference sojourn formula must be verified against the lecture's endpoint and conditioning conventions before drafting.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          29
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-25-sojourn-and-dynamical-recurrence.html"
    }
  ]
