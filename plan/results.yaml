      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-18-shot-noise.html"
    },
    {
      "id": "R18-2",
      "planned_chapter": 18,
      "statement": "Under square-integrable h and finite amplitude second moment, the centered covariance is lambda*E[A squared] times the integral of h(s)*h(s+tau) ds. At one time, the kth cumulant is lambda*E[A raised to k] times the integral of h raised to k when finite.",
      "depends_on": [
        "R18-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Recover triangular covariance for rectangular pulses and verify the second cumulant equals the variance.",
      "hypothesis_boundary": "Use amplitude raw moments in these formulas, not amplitude cumulants; correlated arrivals change the result.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          21
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-18-shot-noise.html"
    },
    {
      "id": "R18-3",
      "planned_chapter": 18,
      "statement": "The centered shot-noise spectrum is lambda*E[A squared]*absolute(H(omega)) squared for pulse transform H. A nonzero mean contributes a separate delta at zero frequency to the uncentered spectrum. Integrating a two-state velocity process creates a continuous position process with memory in its velocity.",
      "depends_on": [
        "R18-2"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Derive the rectangular-pulse spectral zeros and connect two-state velocity correlation to the next chapter's displacement variance.",
      "hypothesis_boundary": "A finite-record zero-frequency bin is not a literal Dirac delta; distinguish centered and uncentered estimates.",
      "source_plan": {
