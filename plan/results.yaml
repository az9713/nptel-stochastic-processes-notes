      "statement": "With a thermal stationary initial velocity, the velocity autocovariance is (k_B*T/m)*exp(-gamma*absolute(tau)). The displacement variance is 2*D*(t-(1-exp(-gamma*t))/gamma), where D=k_B*T/(m*gamma).",
      "depends_on": [
        "R10-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Recover ballistic variance (k_B*T/m)*t squared at short times and 2*D*t at long times.",
      "hypothesis_boundary": "The quoted displacement law uses stationary initial velocity; a fixed initial velocity gives a different transient variance.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          12,
          13
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-10-ornstein-uhlenbeck-brownian.html"
    },
    {
      "id": "R10-3",
      "planned_chapter": 10,
      "statement": "For a stationary zero-mean velocity with integrable autocovariance C_v, displacement variance equals twice the integral from zero to t of (t-s)*C_v(s) ds, and its long-time diffusion coefficient equals the integral of C_v from zero to infinity. Position and velocity together form a Markov state in the inertial Langevin model.",
      "depends_on": [
        "R10-2"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Integrate the OU covariance and compare the joint Gaussian covariance with sampled trajectories.",
      "hypothesis_boundary": "The position coordinate alone generally has memory at finite inertia; Doob classification requires a separate precise cited statement.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          12,
          13
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-10-ornstein-uhlenbeck-brownian.html"
    },
    {
      "id": "R11-1",
      "planned_chapter": 11,
      "statement": "For dX=V*dt and dV=(-gamma*V-omega0 squared*X)*dt+sqrt(2*gamma*k_B*T/m)*dW, positive gamma and omega0 give stable mean dynamics whose eigenvalues solve r squared+gamma*r+omega0 squared=0.",
      "depends_on": [
        "R09-3",
        "R10-3"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Distinguish oscillatory, critical, and overdamped mean relaxation and verify the critical limit without dividing by a vanishing root difference.",
      "hypothesis_boundary": "Stability of mean dynamics alone is not a proof of the full stationary distribution.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          14
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-11-harmonic-and-kramers.html"
    },
    {
      "id": "R11-2",
      "planned_chapter": 11,
      "statement": "For a confining differentiable potential U, the inertial Langevin forward operator with force -U' and thermal noise admits a stationary phase-space density proportional to exp(-(m*v squared/2+U(x))/(k_B*T)), when the normalization is finite and boundary flux conditions hold.",
      "depends_on": [
        "R11-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Substitute the density into the Kramers equation and recover independent harmonic position and velocity variances.",
      "hypothesis_boundary": "Stationary phase-space streaming need not vanish term by term; do not impose overdamped detailed-balance language on each current component.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          14
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-11-harmonic-and-kramers.html"
    },
    {
      "id": "R11-3",
      "planned_chapter": 11,
      "statement": "For the harmonic model with gamma much larger than omega0, one relaxation rate approaches -gamma and the slow rate approaches -omega0 squared/gamma. On slow time scales, constant-friction thermal reduction gives dX=-U'(X)/(m*gamma)*dt+sqrt(2*k_B*T/(m*gamma))*dW.",
      "depends_on": [
        "R11-2"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Compare exact eigenvalues and simulated position covariances across the time-scale separation.",
      "hypothesis_boundary": "The reduction fails at momentum time scales; position-dependent friction needs additional care.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          14
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-11-harmonic-and-kramers.html"
    },
    {
      "id": "R12-1",
      "planned_chapter": 12,
      "statement": "A standard Wiener process starts at zero, has continuous paths and independent Gaussian increments of variance equal to elapsed time. Its covariance at nonnegative times s and t is min(s,t); the process is nonstationary although its increments are stationary.",
      "depends_on": [
        "R03-3",
        "R09-3",
        "R10-3",
        "R11-3"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Compute the covariance from independent increments and compare a covariance heat map with ensemble samples.",
      "hypothesis_boundary": "Continuous paths do not imply differentiable paths; Brownian motion is not finite-correlation colored noise.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          15
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-12-wiener-paths.html"
    },
    {
      "id": "R12-2",
      "planned_chapter": 12,
      "statement": "On uniform partitions of a fixed time interval, the sum of squared Wiener increments converges in mean square to the interval length. Finite-difference velocity over a step h has variance 1/h. Almost-sure differentiability and Holder claims require their own theorem statements and verified citations.",
      "depends_on": [
        "R12-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Derive the mean and variance of quadratic-variation sums and perform mesh refinement.",
      "hypothesis_boundary": "A numerical path cannot prove almost-sure nondifferentiability, the arcsine law, or the iterated-logarithm theorem.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          15
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-12-wiener-paths.html"
    },
    {
      "id": "R12-3",
      "planned_chapter": 12,
      "statement": "The zero-initial OU process solving dX=-gamma*X*dt+b*dW has the same finite-dimensional law as b*exp(-gamma*t)*B((exp(2*gamma*t)-1)/(2*gamma)), where B is a standard Wiener process. The equality is in law unless a coupling is constructed.",
      "depends_on": [
        "R12-2"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Match both Gaussian covariance functions; separately plan cited statements and numerical illustrations of occupation-time and iterated-logarithm results.",
      "hypothesis_boundary": "Finite-dimensional law equivalence should not be confused with equality of arbitrary sampled paths.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          15
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-12-wiener-paths.html"
    },
    {
      "id": "R13-1",
      "planned_chapter": 13,
      "statement": "For scalar dX=a*dt+b*dW and a sufficiently smooth function g(x,t), It\u00f4's rule gives dg=(partial_t g+a*partial_x g+(b squared/2)*partial_xx g)*dt+b*partial_x g*dW, under standard local integrability and existence hypotheses.",
      "depends_on": [
        "R02-3",
        "R09-3",
        "R12-3"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Apply the rule to X squared and recover the missing b squared drift.",
      "hypothesis_boundary": "This is the It\u00f4 convention; Stratonovich notation carries a different chain rule and drift conversion.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          16
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-13-ito-and-radial-diffusion.html"
    },
    {
      "id": "R13-2",
      "planned_chapter": 13,
      "statement": "For d-dimensional Brownian diffusion with coordinate noise amplitude sqrt(2*D), the radius away from zero has drift D*(d-1)/R and noise amplitude sqrt(2*D). Its square Z obeys dZ=2*d*D*dt+sqrt(8*D*Z)*dB.",
      "depends_on": [
        "R13-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Recover mean squared radius 2*d*D*t and the chi radial law from independent coordinates.",
      "hypothesis_boundary": "The radius formula is singular at zero; d=1 requires treatment of the reflecting local-time term. State which scaled process is called Bessel or squared Bessel.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          16
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-13-ito-and-radial-diffusion.html"
    },
    {
      "id": "R13-3",
      "planned_chapter": 13,
      "statement": "For dS=a_S*S*dt+b_S*S*dW with positive initial S, the solution is S0*exp((a_S-b_S squared/2)*t+b_S*W(t)). Its expectation is S0*exp(a_S*t) when the coefficients are constant.",
      "depends_on": [
        "R13-2"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Compare exact logarithmic updates with discretizations that can generate negative values.",
      "hypothesis_boundary": "The Black-Scholes equation additionally requires a market and pricing argument; it does not follow from the change of variables alone.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          16
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-13-ito-and-radial-diffusion.html"
    },
    {
      "id": "R14-1",
      "planned_chapter": 14,
      "statement": "For a stationary differentiable real process with a regular joint density of value and derivative and finite crossing intensity, the mean upcrossing rate at level u is the integral over positive v of v times that joint density at (u,v).",
      "depends_on": [
        "R02-3",
        "R05-3",
        "R10-3",
        "R11-3",
        "R12-3"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Derive the swept-interval argument and recover equal up/down mean rates for a stationary symmetric model.",
      "hypothesis_boundary": "These regularity hypotheses exclude direct application to nondifferentiable Wiener and OU coordinates.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          17
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-14-level-crossing.html"
    },
    {
      "id": "R14-2",
      "planned_chapter": 14,
      "statement": "For a stationary zero-mean differentiable Gaussian process with positive value and derivative standard deviations sigma_X and sigma_V, the upcrossing rate is sigma_V/(2*pi*sigma_X) times exp(-u squared/(2*sigma_X squared)); stationarity makes value and derivative uncorrelated and hence independent.",
      "depends_on": [
        "R14-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Recover the harmonic Brownian position's zero-level crossing rate from equilibrium variances.",
      "hypothesis_boundary": "Finite derivative variance is essential; high-frequency smoothing changes crossing statistics.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          17
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-14-level-crossing.html"
    },
    {
      "id": "R14-3",
      "planned_chapter": 14,
      "statement": "For a twice differentiable regular process, counting maxima can be expressed as zero crossings of the derivative weighted by negative second derivative. The expected number of level crossings does not by itself specify the probability of at least one crossing in a time window.",
      "depends_on": [
        "R14-2"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Construct repeated clustered crossings with the same expected count as a more dispersed process and compare event probabilities.",
      "hypothesis_boundary": "Poisson approximations for rare crossings need additional dependence assumptions. The Brownian oscillator's velocity is not differentiable; do not apply this twice-differentiable extrema formula to it without smoothing.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          17
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-14-level-crossing.html"
    },
    {
      "id": "R15-1",
      "planned_chapter": 15,
      "statement": "For a uniform magnetic field, isotropic drag rate gamma positive, and thermal additive noise, the velocity drift matrix is -gamma times identity plus the antisymmetric Lorentz-rotation matrix. The matrix exponential is exponential damping times the corresponding rotation.",
      "depends_on": [
        "R10-3",
        "R11-3",
        "R12-3"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Verify kinetic energy is unchanged by the Lorentz term and recover the zero-field OU law.",
      "hypothesis_boundary": "Specify signed charge, field orientation, and rotation convention before component formulas.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          18
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-15-magnetic-diffusion.html"
    },
    {
      "id": "R15-2",
      "planned_chapter": 15,
      "statement": "For stationary thermal velocity, the equal-time covariance matrix is (k_B*T/m) times identity. At positive lag the covariance is the drift matrix exponential times this equal-time covariance, so transverse correlations oscillate while decaying.",
      "depends_on": [
        "R15-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Solve the covariance balance equation and test both signed cross-correlations.",
      "hypothesis_boundary": "Antisymmetric cross-correlations do not imply an antisymmetric covariance at equal times.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          18
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-15-magnetic-diffusion.html"
    },
    {
      "id": "R15-3",
      "planned_chapter": 15,
      "statement": "With cyclotron frequency magnitude omega_c, longitudinal diffusion is k_B*T/(m*gamma) and transverse diffusion is (k_B*T/m)*gamma/(gamma squared+omega_c squared). The displacement-covariance diffusion tensor is the symmetric part of the integrated velocity-correlation matrix.",
      "depends_on": [
        "R15-2"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Recover isotropy at zero field and transverse suppression at large omega_c/gamma.",
      "hypothesis_boundary": "An antisymmetric integrated response can encode Hall transport; it is not a contribution to mean-square displacement.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          18
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-15-magnetic-diffusion.html"
    },
    {
      "id": "R16-1",
      "planned_chapter": 16,
      "statement": "For a real stationary zero-mean process with integrable autocovariance C, define the two-sided angular-frequency spectral density S(omega) as the integral over all lag of C(tau)*exp(i*omega*tau). Then C(0) equals the integral of S divided by 2*pi under the corresponding inversion conditions.",
      "depends_on": [
        "R06-3",
        "R10-3",
        "R12-3",
        "R14-3"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Transform an exponential covariance and integrate the resulting Lorentzian to recover the variance.",
      "hypothesis_boundary": "White noise is a generalized process; a nonzero mean adds a zero-frequency delta to the uncentered spectrum.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          19
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-16-noise-spectra.html"
    },
    {
      "id": "R16-2",
      "planned_chapter": 16,
      "statement": "For a stable linear time-invariant filter with transfer matrix H and stationary input spectral matrix S_in, the output spectral matrix is H*S_in*H conjugate-transpose. A valid spectral matrix is Hermitian and positive semidefinite at each frequency where defined.",
      "depends_on": [
        "R16-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Recover the scalar modulus-squared transfer rule and test positivity for correlated two-channel noise.",
      "hypothesis_boundary": "Transfer formulas require a stationary output and appropriate stability/integrability assumptions.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          19
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-16-noise-spectra.html"
    },
    {
      "id": "R16-3",
      "planned_chapter": 16,
      "statement": "In the classical low-frequency equilibrium limit, the resistor voltage-noise density is 2*k_B*T*R in the two-sided angular-frequency convention used here; the corresponding one-sided density per hertz is 4*k_B*T*R. Integrating a physically filtered spectrum gives finite measured variance.",
      "depends_on": [
        "R16-2"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Derive the conversion of conventions and recover capacitor equipartition through a resistor-capacitor filter.",
      "hypothesis_boundary": "The ideal white spectrum is bandwidth-limited physically; quantum and frequency-dependent corrections lie outside this approximation.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          19
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-16-noise-spectra.html"
    },
    {
      "id": "R17-1",
      "planned_chapter": 17,
      "statement": "A causal linear response has change in mean observable at time t equal to the integral over nonnegative lag of response kernel times applied field at t minus lag. With the positive-exponential Fourier convention, susceptibility is the one-sided transform of this kernel.",
      "depends_on": [
        "R10-3",
        "R11-3",
        "R16-3"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Solve the driven damped velocity equation and derive mobility 1/(m*(gamma-i*omega)).",
      "hypothesis_boundary": "Linear response is a small-perturbation statement around a specified reference state.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          20
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-17-linear-response.html"
    },
    {
      "id": "R17-2",
      "planned_chapter": 17,
      "statement": "For a classical equilibrium coordinate coupled to a force through energy -force times coordinate, its centered two-sided spectrum satisfies S_x(omega)=2*k_B*T*Im(chi_x(omega))/omega for nonzero real omega in the stated convention, with the zero-frequency limit taken when it exists.",
      "depends_on": [
        "R17-1"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Recover both the harmonic oscillator spectrum and the free-particle velocity mobility relation using the correctly conjugate variables.",
      "hypothesis_boundary": "The observable, conjugate field, equilibrium hypothesis, and transform sign determine the formula; do not transplant it to arbitrary driven noise.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          20
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-17-linear-response.html"
    },
    {
      "id": "R17-3",
      "planned_chapter": 17,
      "statement": "For a sufficiently decaying real causal response kernel, the positive-exponential susceptibility is analytic in the upper complex-frequency half-plane and obeys conjugate symmetry on the real axis. Dispersion relations require the corresponding decay or subtraction hypotheses.",
      "depends_on": [
        "R17-2"
      ],
      "status_plan": "derive_or_prove_here_under_stated_hypotheses",
      "check": "Locate the damped oscillator poles in the lower half-plane and verify the real/imaginary response relation numerically with a finite-band error study.",
      "hypothesis_boundary": "A truncated numerical Hilbert transform is a check with bandwidth error, not a proof of a dispersion relation.",
      "source_plan": {
        "playlist": "S001",
        "lectures": [
          20
        ]
      },
      "verification": "included in independently reviewed chapter; exact proof or citation stated locally",
      "manuscript_file": "chapter-17-linear-response.html"
    },
    {
      "id": "R18-1",
      "planned_chapter": 18,
      "statement": "For stationary Poisson arrivals on the real time axis of intensity lambda, independent identically distributed amplitudes A, and an integrable pulse shape h, the signal sum A_j*h(t-T_j) has mean lambda*E[A] times the integral of h when the required integrability conditions hold.",
      "depends_on": [
